[package]
name = "tmaps-core"
description = "The map engine of tmaps: geo types, vector tiles, projection, and labels, with no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
geo-types = { version = "0.7", default-features = false }
polyline = "0.11"
prost = "0.14"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
