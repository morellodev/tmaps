[package]
name = "tmaps-core"
description = "The map engine of tmaps: geo types, vector tiles, projection, and labels, with no I/O"
keywords = ["openstreetmap", "maps", "vector-tiles", "mvt", "projection"]
categories = ["science::geo", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test fakes for the crates that use tmaps-core.
test-util = []

[lints]
workspace = true

[dependencies]
geo-types = { version = "0.7", default-features = false }
polyline = "0.11"
prost = "0.14"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
