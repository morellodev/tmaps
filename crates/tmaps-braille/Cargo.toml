[package]
name = "tmaps-braille"
description = "Draws tmaps scenes as braille dots and colored terminal cells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tmaps-core = { version = "0.2.0", path = "../tmaps-core" }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
tmaps-core = { version = "0.2.0", path = "../tmaps-core", features = ["test-util"] }
