[package]
name = "tmaps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal maps with a route planner, and a CLI for AI agents"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
jiff = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tmaps-core = { version = "0.1.0", path = "../tmaps-core" }
tokio = { version = "1", features = ["macros", "rt"] }
toml_edit = "0.25"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.60"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
