[package]
name = "tmaps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal maps with a route planner, and a CLI for AI agents"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
flate2 = "1"
futures-util = "0.3"
jiff = "0.2"
lru = "0.19"
polyline = "0.11"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "json", "query", "gzip", "system-proxy"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
terminal-colorsaurus = "1"
textwrap = "0.16"
thiserror = "2"
tmaps-braille = { version = "0.2.0", path = "../tmaps-braille" }
tmaps-core = { version = "0.2.0", path = "../tmaps-core" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.60"
tmaps-core = { version = "0.2.0", path = "../tmaps-core", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
