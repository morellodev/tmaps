name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runners keep the required glibc version low.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --bin tmaps
      - name: Check that the tag matches the crate version
        run: test "$(target/release/tmaps --version)" = "tmaps ${GITHUB_REF_NAME#v}"
      - run: tar czf "tmaps-${{ matrix.target }}.tar.gz" -C target/release tmaps
      - uses: actions/upload-artifact@v7
        with:
          name: tmaps-${{ matrix.target }}
          path: tmaps-${{ matrix.target }}.tar.gz

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # A rebuild gives new checksums, so a re-run must not replace assets that the formula already uses.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" tmaps-*.tar.gz --verify-tag --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: morellodev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'tmaps-*.tar.gz'
      - name: Write the formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/morellodev/tmaps/releases/download/v${version}"
          sha() { sha256sum "tmaps-$1.tar.gz" | cut -d' ' -f1; }
          # Command substitutions inside a heredoc do not trigger set -e, so a missing file must fail here.
          darwin_arm=$(sha aarch64-apple-darwin)
          darwin_intel=$(sha x86_64-apple-darwin)
          linux_arm=$(sha aarch64-unknown-linux-gnu)
          linux_intel=$(sha x86_64-unknown-linux-gnu)

          mkdir -p Formula
          cat > Formula/tmaps.rb << FORMULA
          class Tmaps < Formula
            desc "Terminal OpenStreetMap maps with a route planner and a JSON CLI"
            homepage "https://github.com/morellodev/tmaps"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/tmaps-aarch64-apple-darwin.tar.gz"
                sha256 "${darwin_arm}"
              end
              on_intel do
                url "${base}/tmaps-x86_64-apple-darwin.tar.gz"
                sha256 "${darwin_intel}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/tmaps-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_arm}"
              end
              on_intel do
                url "${base}/tmaps-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_intel}"
              end
            end

            def install
              bin.install "tmaps"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tmaps --version")
            end
          end
          FORMULA
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tmaps.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update tmaps to ${GITHUB_REF_NAME#v}"
          git push
