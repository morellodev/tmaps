[workspace]
git_only = true
# All crates share the workspace version, so tmaps-core and tmaps-braille find their last release in the tag of tmaps.
# Without a tag, release-plz adds its full history to the changelog of tmaps.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false
# Only changes to the shipped binary open a release PR.
release_commits = "^(feat|fix|refactor|perf)[(:!]"
release_always = false

[[package]]
name = "tmaps"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["tmaps-core", "tmaps-braille"]
git_tag_enable = true
git_release_enable = true

# release-plz 0.4.2 stops when a git_only package is missing at its last tag, and these packages
# came after v0.1.0. They are not released, so the registry lookup does not matter.
[[package]]
name = "tmaps-braille"
release = false
git_only = false

# The web demo ships as a page, not as a release.
[[package]]
name = "tmaps-canvas"
release = false
git_only = false

[changelog]
commit_parsers = [
    { message = "^(ci|test)[(:!]", skip = true },
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^.*", group = "other" },
]
